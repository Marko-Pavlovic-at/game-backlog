<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Game-Backlog</title>
</head>
<body>
    <div id="modalOverlay">
        <div id="modal">
            <div id="modalHeader">
                <h1>Add a Game</h1>
            </div>
            <div id="modalContent">
                <form>
                    <label for="nameInput">Name :</label>
                    <input type="text" id="nameInput" name="nameInput">
                    <label for="statusInput">Status: </label>
                    <select name="statusInput" id="statusInput">
                        <option value="Playing">Playing</option>
                        <option value="done">Done</option>
                        <option value="backlog">Backlog</option>
                    </select>
                    <label for="hoursInput">Hours Played</label>
                    <input type="number" id="hoursInput" name="hoursInput">
                </form>
                </div>
            <div id="modalFooter">
            <button class="btn grayBtn" id="closeBtn">Close</button>
            <button class="btn blueBtn" id="submitBtn">Add</button>
            <p>Please fill out all fields!</p>
        </div>
    </div>
    </div>
    <header>
        <div id="headerBtns">
            <button class="btn blueBtn" id="addGameBtn">Add Game</button>
        </div>
        
        <h1>Game-Backlog</h1>
        
        <form id="addGameForm">
            <p>Input goes here</p>
        </form>
    </header>
    <main>
        <div id="gameList"></div>
    </main>
    <script src="gamelog.js"></script>
</body>
</html>
